<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171411">
  <title>Cursed Cup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;700&family=Manrope:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app" class="match">
    <header class="topbar">
      <div class="score">
        <span class="team">YOU</span>
        <span class="goals" id="score-you">0</span>
        <span class="dash">-</span>
        <span class="goals" id="score-them">0</span>
        <span class="team" id="opp-short">RUS</span>
      </div>
      <div class="clock">
        <span id="clock-min">0'</span>
        <span class="dim" id="clock-turn">T1/12</span>
      </div>
    </header>

    <section class="intent" id="intent"></section>

    <section class="pitch" id="pitch"></section>

    <section class="stats" id="stats"></section>

    <p class="rule">Draw at full time: one golden-goal turn each. Still level: you lose.</p>

    <section class="hand-bar">
      <div class="energy" id="energy"></div>
      <div class="piles" id="piles"></div>
    </section>

    <div class="msg" id="msg" hidden></div>

    <section class="hand" id="hand"></section>

    <div class="actions">
      <button class="btn btn-ghost" id="btn-new" type="button">New match</button>
      <button class="btn btn-main" id="btn-end" type="button">End turn</button>
    </div>

    <section class="log" id="log"></section>

    <div class="overlay" id="overlay" hidden></div>

    <div class="seed" id="seed"></div>
  </main>

  <script src="js/state.js"></script>
  <script src="js/data_cards.js"></script>
  <script src="js/data_opponents.js"></script>
  <script src="js/match.js"></script>
  <script src="js/opponent.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
